<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Inference writing flow</title>
  <desc id="desc">A four-step flow for AP Statistics inference responses.</desc>
  <rect width="720" height="360" fill="#F7F8FA"/>
  <text x="32" y="42" fill="#1F2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Inference FRQ Flow</text>
  <text x="32" y="68" fill="#667085" font-family="Arial, sans-serif" font-size="14">Do not improvise. Follow the scoring sections.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7F77DD"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="100" width="270" height="66" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2"/>
    <text x="78" y="128" fill="#3C3489" font-size="16" font-weight="700">1. Hypotheses</text>
    <text x="78" y="150" fill="#475467" font-size="12">test name + parameter + context</text>

    <rect x="396" y="100" width="270" height="66" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="420" y="128" fill="#185FA5" font-size="16" font-weight="700">2. Conditions</text>
    <text x="420" y="150" fill="#475467" font-size="12">random + 10% + normality/counts</text>

    <rect x="54" y="190" width="270" height="66" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="2"/>
    <text x="78" y="218" fill="#854F0B" font-size="16" font-weight="700">3. Calculation</text>
    <text x="78" y="240" fill="#475467" font-size="12">test statistic + p-value</text>

    <rect x="396" y="190" width="270" height="66" rx="10" fill="#EAF3DE" stroke="#1D9E75" stroke-width="2"/>
    <text x="420" y="218" fill="#2D6110" font-size="16" font-weight="700">4. Conclusion</text>
    <text x="420" y="240" fill="#475467" font-size="12">evidence + population + Ha direction</text>

    <line x1="324" y1="133" x2="388" y2="133" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M531 166 L531 178 L189 178 L189 184" fill="none" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="324" y1="223" x2="388" y2="223" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="48" y="286" width="624" height="48" rx="8" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="64" y="306" fill="#1F2937" font-family="Arial, sans-serif" font-size="13" font-weight="700">Conclusion skeleton:</text>
  <text x="64" y="326" fill="#475467" font-family="Arial, sans-serif" font-size="12">Because p-value __ is less/greater than alpha, reject/fail to reject H0; there is/is not evidence that [parameter] [Ha].</text>
</svg>
