<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Inference writing flow</title>
  <desc id="desc">A four-step flow for AP Statistics inference responses.</desc>
  <rect width="720" height="360" fill="#F7F8FA"/>
  <text x="32" y="42" fill="#1F2937" font-family="Arial, sans-serif" font-size="24" font-weight="700">Inference FRQ Flow</text>
  <text x="32" y="68" fill="#667085" font-family="Arial, sans-serif" font-size="14">Do not improvise. Follow the scoring sections.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7F77DD"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="44" y="110" width="138" height="86" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2"/>
    <text x="66" y="142" fill="#3C3489" font-size="17" font-weight="700">1. Hypotheses</text>
    <text x="66" y="166" fill="#475467" font-size="13">parameter + context</text>

    <rect x="214" y="110" width="138" height="86" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="238" y="142" fill="#185FA5" font-size="17" font-weight="700">2. Conditions</text>
    <text x="238" y="166" fill="#475467" font-size="13">random + 10% + counts</text>

    <rect x="384" y="110" width="138" height="86" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="2"/>
    <text x="408" y="142" fill="#854F0B" font-size="17" font-weight="700">3. Calculation</text>
    <text x="408" y="166" fill="#475467" font-size="13">test statistic + p-value</text>

    <rect x="554" y="110" width="138" height="86" rx="10" fill="#EAF3DE" stroke="#1D9E75" stroke-width="2"/>
    <text x="577" y="142" fill="#2D6110" font-size="17" font-weight="700">4. Conclusion</text>
    <text x="577" y="166" fill="#475467" font-size="13">evidence + population</text>

    <line x1="182" y1="153" x2="207" y2="153" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="352" y1="153" x2="377" y2="153" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="522" y1="153" x2="547" y2="153" stroke="#7F77DD" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <rect x="48" y="238" width="624" height="74" rx="8" fill="#FFFFFF" stroke="#D9DEE7"/>
  <text x="64" y="264" fill="#1F2937" font-family="Arial, sans-serif" font-size="14" font-weight="700">Conclusion skeleton</text>
  <text x="64" y="288" fill="#475467" font-family="Arial, sans-serif" font-size="13">Because p-value __ is less/greater than alpha, reject/fail to reject H0.</text>
  <text x="64" y="308" fill="#475467" font-family="Arial, sans-serif" font-size="13">There is/is not convincing evidence that [population parameter] [Ha direction].</text>
</svg>
